name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blankres
          POSTGRES_PASSWORD: blankres
          POSTGRES_DB: blankres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install GTK development files
        # Only the desktop front end needs these; everything else builds without them.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # With the database reachable, the end-to-end ingest and daemon suites run too; without it
        # they would skip, which is why it is wired up here rather than left optional.
        env:
          BLANKRES_TEST_DATABASE_URL: postgres://blankres:blankres@127.0.0.1:5432/blankres
        run: cargo test --workspace

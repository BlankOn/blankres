# Local deployment of the ingest server and its database.
#
#   docker compose up -d --build
#   curl -s localhost:8080/healthz
#
# The client half is not here: blankresd reads the host's journal, dpkg database and saved core
# dumps, so it runs on the machine being reported on, not in a container. Point it at this server
# by setting BLANKRES_SERVER_URL=http://localhost:8080 and BLANKRES_TOKEN in its config.
#
# This is a development deployment. The token below is a placeholder and the server speaks plain
# HTTP; a real one belongs behind a reverse proxy that terminates TLS.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blankres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blankres}
      POSTGRES_DB: ${POSTGRES_DB:-blankres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The server refuses to serve traffic until its migrations have run, so it must not start
      # against a database that is still initializing.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blankres} -d ${POSTGRES_DB:-blankres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    image: blankres-ingest:${TAG:-0.2.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-blankres}:${POSTGRES_PASSWORD:-blankres}@postgres:5432/${POSTGRES_DB:-blankres}
      # Hashed server-side, so this is the value clients send as their bearer token.
      BLANKRES_TOKEN: ${BLANKRES_TOKEN:-dev-fleet-token}
      # How many core dumps to keep per distinct crash before telling clients not to send more.
      # This one number is what keeps a fleet-wide flood of gigabyte cores down to a handful.
      BLANKRES_PAYLOADS_PER_SIGNATURE: ${BLANKRES_PAYLOADS_PER_SIGNATURE:-5}
      RUST_LOG: ${RUST_LOG:-blankres_server=info}
    ports:
      - "${BLANKRES_PORT:-8080}:8080"
    volumes:
      # Core dumps are large and worth keeping across a rebuild of the image.
      - ingest-storage:/var/lib/blankres-ingest
    restart: unless-stopped

volumes:
  postgres-data:
  ingest-storage:
